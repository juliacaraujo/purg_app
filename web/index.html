<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover: permite que o conteúdo use a área completa da tela,
      incluindo notch e home indicator — necessário para env(safe-area-inset-*).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Purg</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Purg" />
    <meta property="og:title" content="Purg — Crie seu patrimônio" />
    <meta property="og:description" content="Invista com inteligência e conquiste seus objetivos financeiros." />
    <meta property="og:image" content="https://purg.com.br/logo.png" />
    <meta property="og:url" content="https://purg.com.br" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Purg — Crie seu patrimônio" />
    <meta name="twitter:description" content="Invista com inteligência e conquiste seus objetivos financeiros." />
    <meta name="twitter:image" content="https://purg.com.br/logo.png" />
    <style id="expo-reset">
      /*
        100dvh (dynamic viewport height) desconta a barra de endereços e a UI
        do navegador. Fallback para 100% em browsers antigos que não suportam dvh.
      */
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
